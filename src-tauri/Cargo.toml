[package]
name = "pixelpaw"
version = "0.1.0"
description = "PixelPaw - An AI-powered living desktop pet for macOS"
authors = ["PixelPaw"]
edition = "2021"

[lib]
name = "pixelpaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
tauri-plugin-single-instance = "2.5.2"
objc2-app-kit = "0.3.2"
reqwest = { version = "0.13.5", features = ["json"] }
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
tauri-plugin-clipboard-manager = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24"
objc = "0.2"
core-graphics = "0.23"
core-foundation = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
